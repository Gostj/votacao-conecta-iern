<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Votação – Conecta IERN</title>
<style>
:root{--bg:#f3f7ff;--card:#fff;--tx:#0f2a63;--mu:#5b6b8f;--ac:#0f2a63;--acx:#fff;--bd:#d9e3f5;--ok:#2e8b3d;--er:#d32f2f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#081633;--card:#0f2557;--tx:#f3f7ff;--mu:#a9b8d9;--ac:#ffc20e;--acx:#0f2a63;--bd:#21407f;--ok:#6fdc7f;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="off"]{--bg:#081633;--card:#0f2557;--tx:#f3f7ff;--mu:#a9b8d9;--ac:#ffc20e;--acx:#0f2a63;--bd:#21407f;--ok:#6fdc7f;--er:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#fff,#edf3ff 420px)}
.hdr{background:#fff;border-bottom:6px solid #ffc20e;text-align:center;padding:14px 16px 12px}
.hdr img{max-height:110px;max-width:80%}
.hdr .nm{margin:6px 0 0;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#0f2a63}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:var(--card);border:1px solid var(--bd);flex:none}
.emo{display:flex;align-items:center;justify-content:center;font-size:30px}
h1{font-size:1.4rem;margin:0;font-weight:800}
h2{font-size:1.1rem;margin:14px 0 8px}
h2.q{font-size:1.3rem;font-weight:800}
.sub{color:var(--mu);margin:0;font-size:.9rem}
.tabs{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:1.05rem}
.card p{margin:0;color:var(--mu);font-size:.9rem}
.card.sel{border:2px solid #43a047}
.opt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--bd)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
button.pri{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;white-space:nowrap}
button.pri:disabled{opacity:.5}
button.gh{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit}
button.dg{background:none;border:0;color:var(--er);font:inherit;padding:6px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.bar{height:10px;border-radius:6px;background:var(--bd);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%}
.msg{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd);margin-bottom:12px;font-size:.92rem}
.ok{color:var(--ok)}.er{color:var(--er)}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.pos{font-weight:700;font-size:1.2rem;min-width:2ch}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dlg{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
.dlg h3{margin:0 0 8px}
.small{font-size:.82rem;color:var(--mu)}
.vb{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--bg) 35%)}
.vb button{width:100%;padding:14px;font-size:1.05rem}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--bd)}
</style>
</head>

<main id="app"></main>

let site = { name: 'Votação', tag: 'Criando pontes entre Arte, Ciência e Cultura', logo: '' };
let polls = {}, ballots = {}, kv = [], view = { n: 'home' }, note = '', sel = null, joined = false, nick = '', autoOpen = false;
try { nick = localStorage.getItem('nick') || ''; } catch (e) {}
const ok = m => note = `<span class="ok">${m}</span>`, er = m => note = `<span class="er">${m}</span>`;
const mine = pid => ballots[uid] && ballots[uid][pid];
const wantAdmin = () => true;
const adm = () => canEdit && wantAdmin();
addEventListener('hashchange', () => { view = { n: 'home' }; autoOpen = false; render(); });
function count(pid) { let n = kv.filter(k => k.poll === pid).length; Object.values(ballots).forEach(b => { if (b && b[pid]) n++; }); return n; }
function tally(p) {
  const c = {}; p.rooms.forEach(r => c[r.id] = 0);
  kv.forEach(k => { if (k.poll === p.id && k.room in c) c[k.room]++; });
  Object.values(ballots).forEach(b => { const v = b && b[p.id]; if (v && v.room in c) c[v.room]++; });
  return p.rooms.map(r => ({ ...r, n: c[r.id] })).sort((a, b) => b.n - a.n);
}
function modal(h) { $('#modal').innerHTML = h ? `<div class="ov"><div class="dlg">${h}</div></div>` : ''; }

function render() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA/.test(a.tagName)) return;
  $('#hdr').innerHTML = `<img src="${esc(site.logo || LOGO)}" alt="Conecta IERN"><p class="nm">${esc(site.name)}${adm() ? ' · Administrativo' : ''}</p>`;
  let h = '';
  if (note) h += `<div class="msg">${note}</div>`;
  if (failed) h += `<div class="msg er">Não foi possível acessar os dados agora. Tente novamente mais tarde.</div>`;
  else if (!db && loaded) h += `<div class="msg er">Abra a página pelo link compartilhado, com a sua conta, para participar.</div>`;
  else if (!loaded) h += `<div class="empty">Carregando…</div>`;
  else if (wantAdmin() && !canEdit) h += `<div class="msg er">🔒 Área administrativa restrita. Entre com a conta de administrador para acessar.</div>`;
  else {
    const ids = Object.keys(polls);
    if (adm() && view.n === 'home' && ids.length === 1 && !autoOpen) { autoOpen = true; view = { n: 'poll', id: ids[0], tab: 'edit' }; }
    h += view.n === 'home' ? home() : poll();
  }
  $('#app').innerHTML = h;
}

function home() {
  const list = Object.values(polls).sort((x, y) => (y.at || 0) - (x.at || 0));
  let h = `<h2>${adm() ? 'Painel administrativo' : 'Votações disponíveis'}</h2>`;
  if (!list.length) h += `<div class="empty">Nenhuma votação disponível ainda.${adm() ? ' Crie a primeira abaixo.' : ''}</div>`;
  h += list.map(p => `<div class="card"><div class="row"><div><h3>${esc(p.title)}</h3><p>${p.open ? 'Aberta' : 'Encerrada'} · ${count(p.id)} voto${count(p.id) === 1 ? '' : 's'}</p></div>
    <button class="pri" data-open="${esc(p.id)}">${adm() ? 'Gerenciar' : mine(p.id) || !p.open ? 'Ver resultado' : 'Participar'}</button></div></div>`).join('');
  h += `<p class="small">🔒 Cada pessoa pode votar uma única vez em cada votação.</p>`;
  if (adm()) h += `<div class="card"><h3>Nova votação</h3><br><input id="nt" placeholder="Título (ex.: Melhor sala da feira)" maxlength="80">
    <input id="nq" placeholder="Pergunta principal (ex.: Qual sala você mais gostou?)" maxlength="120"><button class="pri" data-act="newpoll">Criar votação</button></div>
    <div class="card"><h3>Identidade do aplicativo</h3><br><input id="sn" value="${esc(site.name)}" placeholder="Nome do aplicativo" maxlength="50">
    <input id="st" value="${esc(site.tag)}" placeholder="Frase de apoio" maxlength="80">
    ${assets ? `<p class="small">Logotipo:</p><input id="sl" type="file" accept="image/*">` : ''}<button class="pri" data-act="site">Salvar</button></div>`;
  return h;
}

function poll() {
  const p = polls[view.id];
  if (!p) { view = { n: 'home' }; return home(); }
  let h = '';
  if (kiosk) h += `<div class="small" style="text-align:right"><button class="gh" data-act="exit">Sair do modo quiosque</button></div>`;
  else {
    const t = adm() ? [['result', 'Acompanhar'], ['edit', 'Candidatos'], ['audit', 'Auditoria']] : [['votar', 'Votar'], ['result', 'Resultados']];
    h += `<button class="gh" data-act="home">← Votações</button><div class="tabs">${t.map(x => `<button data-tab="${x[0]}" class="${view.tab === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>`;
  }
  const tab = kiosk ? 'votar' : view.tab;
  if (adm() && !kiosk) h += `<div class="msg">📊 <b>${count(p.id)}</b> voto${count(p.id) === 1 ? '' : 's'} · ${p.rooms.length} candidato${p.rooms.length === 1 ? '' : 's'} · ${p.open ? 'Votação aberta' : 'Votação encerrada'}</div>`;
  return h + (tab === 'votar' ? vVote(p) : tab === 'result' ? vRes(p) : tab === 'edit' ? vEdit(p) : vAudit(p));
}

function vVote(p) {
  const m = kiosk ? null : mine(p.id);
  let h = `<h2 class="q">${esc(p.question || p.title)}</h2>`;
  if (!p.open) h += `<div class="msg">Esta votação foi encerrada.</div>`;
  else if (m) h += `<div class="msg ok">✅ Seu voto foi registrado. Cada pessoa só pode votar uma vez e o voto não pode ser alterado.</div>`;
  else h += `<div class="msg">Escolha uma opção. Você terá que confirmar, e o voto não poderá ser alterado depois.</div>`;
  if (!p.rooms.length) return h + `<div class="empty">Esta votação ainda não tem opções.</div>`;
  if (p.open && !m && !kiosk && !joined) return `<h2 class="q">Entre para votar</h2><div class="card"><h3>Qual é o seu nome?</h3><br><input id="nick" value="${esc(nick)}" placeholder="Digite seu nome" maxlength="30" autocomplete="off"><button class="pri" style="width:100%" data-act="join">Entrar</button></div><p class="small">Cada pessoa só pode votar uma vez.</p>`;
  const cur = m ? m.room : sel, can = p.open && !m;
  return h + (nick && !kiosk ? `<p class="small">Olá, <b>${esc(nick)}</b>!</p>` : '') + p.rooms.map(r => `<div class="card opt ${cur === r.id ? 'sel' : ''}" ${can ? `data-pick="${esc(r.id)}" style="cursor:pointer"` : ''}>${r.img ? `<img src="${esc(r.img)}" alt="${esc(r.name)}">` : ''}<h3>${esc(r.name)}</h3>${r.desc ? `<p>${esc(r.desc)}</p>` : ''}${m && m.room === r.id ? '<p class="ok"><b>✅ Seu voto</b></p>' : ''}</div>`).join('') + (can ? `<div class="vb"><button class="pri" data-ask="${esc(sel || '')}" ${sel ? '' : 'disabled'}>Votar</button></div>` : '');
}

function vRes(p) {
  const rows = tally(p), max = Math.max(1, ...rows.map(r => r.n)), tot = rows.reduce((s, r) => s + r.n, 0), md = ['🥇', '🥈', '🥉'];
  let h = `<h2 class="q">${esc(p.question || p.title)}</h2><p class="small">${tot} voto${tot === 1 ? '' : 's'} · ${p.open ? 'parcial, atualizando ao vivo' : 'resultado final'}</p><br>`;
  if (!rows.length) return h + `<div class="empty">Sem opções cadastradas.</div>`;
  return h + rows.map((r, i) => `<div class="card"><div class="row"><div class="pos">${(r.n > 0 && md[i]) || i + 1}</div>
    <div style="flex:1"><h3>${esc(r.name)}</h3><div class="bar"><i style="width:${r.n / max * 100}%;background:${COL[i % 4]}"></i></div></div>
    <div><b>${r.n}</b> <span class="small">${tot ? Math.round(r.n / tot * 100) : 0}%</span></div></div></div>`).join('');
}

function vEdit(p) {
  const lock = count(p.id) > 0;
  let h = `<div class="card"><div class="row"><div><h3>Status</h3><p>${p.open ? 'Aberta' : 'Encerrada'}</p></div><button class="pri" data-act="toggle">${p.open ? 'Encerrar' : 'Reabrir'}</button></div></div>`;
  if (lock) h += `<div class="msg">🔒 Já existem votos: adicionar ou remover candidatos e mudar a pergunta está bloqueado para proteger o resultado. Para recomeçar, crie uma nova votação.</div>`;
  else h += `<div class="card"><h3>Pergunta</h3><br><input id="pt" value="${esc(p.title)}" maxlength="80"><input id="pq" value="${esc(p.question || '')}" maxlength="120"><button class="pri" data-act="savep">Salvar</button></div>
    <div class="card"><h3>Adicionar candidato</h3><br><label class="small" for="rn">Nome do candidato</label><input id="rn" placeholder="Ex.: Sala 3 – Robótica" maxlength="60"><label class="small" for="rd">Descrição</label><input id="rd" placeholder="Conte em uma frase sobre o projeto" maxlength="140">
    ${assets ? `<p class="small">Foto:</p><input id="rf" type="file" accept="image/*">` : '<p class="small">Envio de fotos disponível para quem tem permissão de editor.</p>'}<button class="pri" data-act="addroom">➕ Adicionar candidato</button></div>`;
  h += `<h2>Candidatos (${p.rooms.length})</h2>` + (p.rooms.length ? '' : `<div class="empty">Nenhum candidato ainda. Use o formulário acima para adicionar.</div>`) + p.rooms.map(r => `<div class="card"><div class="row"><div style="display:flex;gap:10px;align-items:center">${r.img ? `<img class="logo" src="${esc(r.img)}" alt="">` : ''}<div><h3>${esc(r.name)}</h3>${r.desc ? `<p>${esc(r.desc)}</p>` : ''}</div></div><button class="gh" data-delroom="${esc(r.id)}" ${lock ? 'disabled' : ''}>🗑 Remover</button></div></div>`).join('');
  if (isOwner && p.open && p.rooms.length) h += `<div class="card"><div class="row"><div><h3>Modo quiosque</h3><p>Para visitantes sem conta: cada toque é um voto.</p></div><button class="pri" data-act="kiosk">Iniciar</button></div></div>`;
  if (!lock) h += `<button class="dg" data-act="delpoll">Excluir votação</button>`;
  return h;
}

function vAudit(p) {
  const ev = kv.filter(k => k.poll === p.id).map(k => ({ at: k.at, who: 'Quiosque' }));
  Object.entries(ballots).forEach(([id, b]) => { if (b && b[p.id]) ev.push({ at: b[p.id].at, who: (b[p.id].name || 'Sem nome') + ' · ' + id.slice(-4) }); });
  ev.sort((x, y) => y.at - x.at);
  const tot = tally(p).reduce((s, r) => s + r.n, 0);
  return `<div class="msg ${tot === ev.length ? 'ok' : 'er'}">${tot === ev.length ? '✔ Integridade: votos contados e registros de auditoria conferem' : '⚠ Divergência: ' + tot + ' votos contados e ' + ev.length + ' registros'} (${ev.length})</div>
    <p class="small">O registro mostra data, hora e o nome informado. Não mostra a escolha de cada pessoa.</p>
    ${ev.map(x => `<div class="lg"><span>${new Date(x.at).toLocaleString('pt-BR')}</span><span>${esc(x.who)}</span></div>`).join('') || '<div class="empty">Nenhum voto registrado.</div>'}`;
}

async function shrink(file, max, type) {
  const b = await createImageBitmap(file), s = Math.min(1, max / Math.max(b.width, b.height));
  const c = document.createElement('canvas'); c.width = Math.round(b.width * s); c.height = Math.round(b.height * s);
  c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, type, .82));
}
async function up(inputId, max, type) {
  const f = ($('#' + inputId) || {}).files; if (!f || !f[0] || !assets) return '';
  return (await assets.upload(await shrink(f[0], max, type))).url;
}
const savePoll = p => db.doc('polls/' + p.id).set(p);

async function cast(pid, rid) {
  const p = polls[pid]; if (!p || !p.open || !db) return;
  busy = true;
  try {
    if (kiosk) { await db.collection('kiosk').add({ poll: pid, room: rid, at: Date.now() }); ok('✅ Obrigado pelo seu voto!'); sel = null; }
    else {
      if (!uid) { er('Entre na sua conta para votar.'); return; }
      const cur = await db.doc('ballots/' + uid).get(), b = cur.exists ? cur.data() : {};
      if (b[pid]) { er('Você já votou nesta votação.'); return; }
      b[pid] = { room: rid, at: Date.now(), name: nick };
      await db.doc('ballots/' + uid).set(b);
      ok('✅ Voto registrado. Obrigado!'); view.tab = 'result';
    }
  } catch (e) { er('Seu acesso não permite votar. Peça um link de participante (Contributor).'); }
  finally { busy = false; render(); }
}

document.addEventListener('click', async e => {
  const pk = e.target.closest('[data-pick]');
  if (pk && !busy && !e.target.closest('button')) { sel = pk.dataset.pick; return render(); }
  const t = e.target.closest('button'); if (!t || busy) return;
  const d = t.dataset; note = '';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  try {
    if (d.open) { sel = null; joined = false; view = { n: 'poll', id: d.open, tab: adm() ? 'result' : (mine(d.open) || !polls[d.open].open) ? 'result' : 'votar' }; return render(); }
    if (d.tab) { view.tab = d.tab; return render(); }
    if (d.act === 'home') { view = { n: 'home' }; return render(); }
    if (d.act === 'join') {
      const n = val('nick');
      if (n.length < 2) { er('Digite seu nome (mínimo 2 letras).'); return render(); }
      nick = n; try { localStorage.setItem('nick', n); } catch (e) {}
      joined = true; return render();
    }
    if (d.act === 'cancel') return modal('');
    if (d.ask) {
      const r = polls[view.id].rooms.find(x => x.id === d.ask); if (!r) return;
      return modal(`<h3>Confirmar voto</h3><p>Você vai votar em <b>${esc(r.name)}</b>. Cada pessoa só pode votar uma vez e o voto não poderá ser alterado.</p><br><div class="row"><button class="gh" data-act="cancel">Cancelar</button><button class="pri" data-go="${esc(d.ask)}">Confirmar voto</button></div>`);
    }
    if (d.go) { modal(''); return cast(view.id, d.go); }
    if (d.act === 'exit') { if (prompt('Para sair do modo quiosque, digite: sair') === 'sair') { kiosk = false; render(); } return; }
    if (!canEdit || !db) return;
    const p = polls[view.id];
    if (d.act === 'newpoll') {
      const title = val('nt'); if (!title) return;
      const id = 'p' + Date.now().toString(36);
      await savePoll({ id, title, question: val('nq') || title, open: true, rooms: [], at: Date.now() });
      view = { n: 'poll', id, tab: 'edit' }; return render();
    }
    if (d.act === 'site') {
      busy = true; note = 'Salvando…'; render();
      const logo = await up('sl', 256, 'image/png');
      await db.doc('config/site').set({ name: val('sn') || site.name, tag: val('st'), logo: logo || site.logo });
      busy = false; return ok('Salvo.'), render();
    }
    if (d.act === 'toggle') { p.open = !p.open; await savePoll(p); return render(); }
    if (d.act === 'savep') { if (count(p.id)) return; p.title = val('pt') || p.title; p.question = val('pq') || p.title; await savePoll(p); return ok('Salvo.'), render(); }
    if (d.act === 'addroom') {
      if (count(p.id)) return; const name = val('rn'); if (!name) return;
      busy = true; note = 'Enviando…'; render();
      let img = ''; try { img = await up('rf', 900, 'image/jpeg'); } catch (e) { img = ''; }
      p.rooms = p.rooms.concat({ id: 'o' + Date.now().toString(36), name, desc: val('rd'), img });
      await savePoll(p); busy = false; note = (($('#rf') || {}).files || [])[0] && !img ? '<span class="er">Candidato adicionado, mas a foto não pôde ser enviada.</span>' : ''; return render();
    }
    if (d.delroom) { if (count(p.id) || !confirm('Remover este candidato?')) return; p.rooms = p.rooms.filter(r => r.id !== d.delroom); await savePoll(p); return render(); }
    if (d.act === 'delpoll') { if (count(p.id) || !confirm('Excluir esta votação?')) return; await db.doc('polls/' + p.id).delete(); view = { n: 'home' }; return render(); }
    if (d.act === 'kiosk' && isOwner) { kiosk = true; view.tab = 'votar'; return render(); }
  } catch (err) { busy = false; er('Não foi possível concluir. Verifique suas permissões e tente de novo.'); render(); }
});

(async () => {
  render();
  try { const u = await claude.use('user'); if (u) { uid = await u.id(); isOwner = u.isOwner(); canEdit = isOwner || u.canEdit(); } } catch (e) {}
  try { db = await claude.use('db'); } catch (e) {}
  try { assets = await claude.use('assets'); } catch (e) {}
  if (!db) { loaded = true; return render(); }
  const timer = setTimeout(() => { if (!loaded) { failed = true; render(); } }, 10000);
  const onErr = () => { clearTimeout(timer); loaded = true; failed = true; render(); };
  db.doc('config/site').onSnapshot(s => { if (s.exists) site = { ...site, ...s.data() }; render(); }, onErr);
  db.collection('polls').onSnapshot(s => {
    clearTimeout(timer); loaded = true; failed = false; polls = {};
    s.docs.forEach(x => polls[x.id] = { rooms: [], open: true, ...x.data(), id: x.id }); render();
  }, onErr);
  db.collection('ballots').onSnapshot(s => { ballots = {}; s.docs.forEach(x => ballots[x.id] = x.data()); render(); }, onErr);
  db.collection('kiosk').onSnapshot(s => { kv = s.docs.map(x => x.data()); render(); }, onErr);
})();
</script>
